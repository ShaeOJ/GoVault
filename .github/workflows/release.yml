name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows/amd64
            os: windows-latest
            asset_name: GoVault-windows-amd64.exe
            nsis: true
          - platform: darwin/arm64
            os: macos-latest
            asset_name: GoVault-macos-arm64.zip
          - platform: darwin/amd64
            os: macos-latest
            asset_name: GoVault-macos-amd64.zip
          - platform: linux/amd64
            os: ubuntu-22.04
            asset_name: GoVault-linux-amd64
            tags: ""
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            asset_name: GoVault-linux-arm64
            tags: webkit2_41

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install NSIS (Windows installer)
        if: matrix.nsis
        run: choco install nsis -y

      - name: Install Linux deps
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          if [ "${{ matrix.tags }}" = "webkit2_41" ]; then
            sudo apt-get install -y libwebkit2gtk-4.1-dev
          else
            sudo apt-get install -y libwebkit2gtk-4.0-dev
          fi

      - name: Build
        run: wails build -platform ${{ matrix.platform }} ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }} ${{ matrix.nsis && '-nsis' || '' }} -ldflags "-X govault/internal/version.Version=${{ github.ref_name }}"

      - name: Package Windows
        if: startsWith(matrix.platform, 'windows')
        run: mv build/bin/GoVault.exe ${{ matrix.asset_name }}

      - name: Upload Windows installer
        if: startsWith(matrix.platform, 'windows')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/GoVault-amd64-installer.exe

      - name: Package macOS
        if: startsWith(matrix.platform, 'darwin')
        run: |
          cd build/bin
          zip -r ../../${{ matrix.asset_name }} GoVault.app

      - name: Package Linux
        if: startsWith(matrix.platform, 'linux')
        run: |
          mv build/bin/GoVault ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}

  build-headless:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build headless edge node (all platforms, pure Go)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          b() { GOOS=$1 GOARCH=$2 go build -ldflags="-s -w -X govault/internal/version.Version=${{ github.ref_name }}" -o "dist/$3" ./cmd/govault-headless; }
          b windows amd64 govault-headless-windows-amd64.exe
          b linux   amd64 govault-headless-linux-amd64
          b linux   arm64 govault-headless-linux-arm64
          b darwin  amd64 govault-headless-macos-amd64
          b darwin  arm64 govault-headless-macos-arm64

      - name: Upload headless release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/govault-headless-*
